services:
  - type: web
    name: holy-oly-3
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: holy-oly-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_PROJECT_ID
        value: liftai-evolved-strength
      - key: GOOGLE_LOCATION
        value: us-central1
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "200"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"

databases:
  - name: holy-oly-db
    plan: free
    region: oregon
    ipAllowList: []
    postgresMajorVersion: "15"
