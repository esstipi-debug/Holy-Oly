services:
  - type: web
    name: holy-oly-3
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: holy-oly-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_PROJECT_ID
        value: liftai-evolved-strength
      - key: GOOGLE_LOCATION
        value: us-central1
      - key: LOG_LEVEL
        value: "INFO"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "200"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
    healthCheckPath: /health
    # Orden importante: 000_init crea users/baseline/social/payments antes que el resto
    # `|| true` evita que falle el deploy si una migración legacy ya corrió
    preDeployCommand: |
      cd backend && python -c "
      import psycopg2, sys
      conn = psycopg2.connect('$DATABASE_URL')
      cur = conn.cursor()
      for f in ['000_init.sql','001_enable_rls.sql','002_enable_pgvector.sql','003_wise_score.sql','004_rag_self_healing.sql','005_github_oauth.sql']:
          try:
              cur.execute(open(f'migrations/{f}').read())
              conn.commit()
              print(f'[migration] OK {f}')
          except Exception as e:
              conn.rollback()
              print(f'[migration] SKIP {f}: {e}', file=sys.stderr)
      cur.close(); conn.close()
      "

  - type: static site
    name: holy-oly-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

databases:
  - name: holy-oly-postgres
    databaseName: holy_oly_db
    user: holy_oly_user
    region: oregon
    postgresMajorVersion: "15"
